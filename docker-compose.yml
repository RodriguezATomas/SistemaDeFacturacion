# Desarrollo local y despliegue base.
#   Solo infraestructura:   docker compose up -d postgres s3 mailpit
#   Stack completo:         docker compose --profile app up -d --build
# Producción: combinar con docker-compose.prod.yml (ver docs/DEPLOYMENT.md).
name: facturacion

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facturacion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facturacion}
      POSTGRES_DB: ${POSTGRES_DB:-facturacion}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facturacion} -d ${POSTGRES_DB:-facturacion}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Almacenamiento compatible con S3 (SeaweedFS). La API crea el bucket al iniciar si no existe.
  s3:
    image: chrislusf/seaweedfs:4.54
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=0 -master.volumeSizeLimitMB=1024
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-facturacion}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-facturacion-dev-secret}
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-saas}
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGINS: ${APP_URL:-http://localhost:8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-facturacion}:${POSTGRES_PASSWORD:-facturacion}@postgres:5432/${POSTGRES_DB:-facturacion}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://s3:8333
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-facturacion}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-facturacion}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-facturacion-dev-secret}
      S3_FORCE_PATH_STYLE: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      LOG_JSON: "true"
    ports:
      - "${API_PORT:-3000}:3000"

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  s3data:
